<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PustakaHub - Tambah Buku</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="container">
    <aside class="sidebar">
        <h2>PustakaHub</h2>
        <ul>
            <li><a href="../index.html">Dashboard</a></li>
            <li><a href="./index.html">Koleksi Buku</a></li>
            <li><a href="../user/index.html">Data Anggota</a></li>
        </ul>
    </aside>

    <main class="content">
        <h1>Tambah Buku</h1>
        <br>

        <div class="form-container">
            <h2>Form Data Buku Baru</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="kode">Kode Buku</label>
                    <input type="text" id="kode" name="kode" placeholder="Misal: BK-006" required>
                </div>

                <div class="form-group">
                    <label for="judul">Judul Buku</label>
                    <input type="text" id="judul" name="judul" placeholder="Masukkan judul buku" required>
                </div>

                <div class="form-group">
                    <label for="kategori">Kategori</label>
                    <select id="kategori" name="kategori" required>
                        <option value="" disabled selected>-- Pilih Kategori --</option>
                        <option value="Teknologi">Teknologi</option>
                        <option value="Sains">Sains</option>
                        <option value="Sastra">Sastra</option>
                        <option value="Bisnis">Bisnis</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="jumlah">Jumlah Eksemplar</label>
                    <input type="number" id="jumlah" name="jumlah" min="0" placeholder="0" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-save">Simpan Data</button>
                    <a href="./index.html" class="btn-cancel">Batal</a>
                </div>
            </form>
        </div>
    </main>
</div>

</body>
</html>
