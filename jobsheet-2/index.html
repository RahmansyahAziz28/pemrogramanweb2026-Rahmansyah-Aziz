<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PustakaHub - Sistem Perpustakaan</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

<div class="container">
    <aside class="sidebar">
        <h2>PustakaHub</h2>
        <ul>
            <li><a href="./index.html">Dashboard</a></li>
            <li><a href="./item/index.html">Koleksi Buku</a></li>
            <li><a href="./user/index.html">Data Anggota</a></li>
        </ul>
    </aside>

    <main class="content">
        <h1>Dashboard Perpustakaan</h1>
        <p>Sistem informasi pengelolaan pustaka, koleksi buku, dan anggota.</p>
        <br>

        <div class="dashboard-cards">
            <div class="card card-buku">
                <h3>Total Buku</h3>
                <div class="value">1.840</div>
                <p class="desc">Eksemplar buku terdaftar</p>
            </div>

            <div class="card card-anggota">
                <h3>Total Anggota</h3>
                <div class="value">320</div>
                <p class="desc">Anggota aktif terdaftar</p>
            </div>

            <div class="card card-kategori">
                <h3>Kategori Buku</h3>
                <div class="value">16</div>
                <p class="desc">Klasifikasi literatur</p>
            </div>
        </div>
    </main>
</div>

</body>
</html>
