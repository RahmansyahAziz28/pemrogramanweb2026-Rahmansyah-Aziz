<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crime Records | Tambah Tersangka (Bootstrap 5)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <header class="navbar navbar-expand-lg navbar-dark bg-gcpd-header">
        <div class="container">
            <a class="navbar-brand fw-bold text-gold" href="../index.html">Crime Records System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Daftar Tersangka</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Tersangka</a></li>
                    <li class="nav-item"><a class="nav-link" href="../investigators/list.html">Daftar Penyidik</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-4">
        <section class="card shadow-sm mb-4 bg-gcpd-card text-light">
            <div class="card-body">
                <h2 class="card-title text-gold mb-3">Registrasi Berkas Tersangka Baru</h2>
                <form action="list.html" method="get">
                    <div class="mb-3">
                        <label for="identification_number" class="form-label text-secondary">Nomor Identitas (ID Polisi / Dokumen)</label>
                        <input type="text" class="form-control bg-dark text-light border-secondary" id="identification_number" name="identification_number" placeholder="Contoh: GTH-ID-99210" required>
                    </div>

                    <div class="mb-3">
                        <label for="full_name" class="form-label text-secondary">Nama Lengkap / Alias</label>
                        <input type="text" class="form-control bg-dark text-light border-secondary" id="full_name" name="full_name" placeholder="Masukkan nama lengkap tersangka" required>
                    </div>

                    <div class="mb-3">
                        <label for="date_of_birth" class="form-label text-secondary">Tanggal Lahir</label>
                        <input type="date" class="form-control bg-dark text-light border-secondary" id="date_of_birth" name="date_of_birth">
                    </div>

                    <div class="mb-3">
                        <label for="gender" class="form-label text-secondary">Jenis Kelamin</label>
                        <select class="form-select bg-dark text-light border-secondary" id="gender" name="gender">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="address" class="form-label text-secondary">Alamat / Lokasi Terakhir Terlihat</label>
                        <textarea class="form-control bg-dark text-light border-secondary" id="address" name="address" rows="3" placeholder="Masukkan alamat atau lokasi terakhir..."></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-gold">Simpan Berkas</button>
                        <a href="list.html" class="btn btn-outline-secondary">Kembali</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="text-center py-3 border-top border-secondary text-secondary">
        <p class="mb-0">&copy; 2026 Gotham City Police Department  (Bootstrap 5)</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
